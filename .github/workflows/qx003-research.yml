name: QX-003 close-only comparison
on:
  push:
    branches: [research/qx-003-20261127]
    paths: ['backtest/kc50_backtest.py', 'backtest/qx003*', 'backtest/test_qx003.py', '.github/workflows/qx003-research.yml']
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Shanghai
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install 'pandas==2.2.3' 'numpy==2.2.6' 'pyarrow==19.0.1' tushare requests six tabulate
      - run: python -m unittest backtest.test_qx_profit backtest.test_qx_engine backtest.test_qx003 -v
      - run: python -u backtest/qx003_compare.py
      - name: Save research results
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/backtest/qx003_20261127
          git diff --cached --quiet || git commit -m 'QX-003 close-only results [skip ci]'
          git push origin HEAD:research/qx-003-20261127
