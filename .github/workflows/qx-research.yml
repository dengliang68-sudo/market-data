name: QX strategy comparison
on:
  push:
    branches: [research/qx-002-20261127]
    paths:
      - 'backtest/qx_*'
      - 'backtest/kc50_backtest.py'
      - 'backtest/test_qx_profit.py'
      - '.github/workflows/qx-research.yml'
permissions:
  contents: write
concurrency:
  group: qx-research-20261127
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Shanghai
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install 'pandas==2.2.3' 'numpy==2.2.6' 'pyarrow==19.0.1' tushare requests six tabulate
      - run: python -m unittest backtest.test_qx_profit -v
      - name: Offline cached data comparison
        run: python -u backtest/qx_compare.py
      - name: Save research outputs on research branch
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/backtest/qx_20261127
          git diff --cached --quiet || git commit -m 'QX-001 vs QX-002 research results [skip ci]'
          git push origin HEAD:research/qx-002-20261127
