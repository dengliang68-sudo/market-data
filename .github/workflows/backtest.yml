name: backtest-options
on:
  workflow_dispatch:
    inputs:
      script:
        description: "opt=多品种回测；kc50=科创50新旧规则对比；xval=跨品种验证"
        required: true
        default: "opt"
      start:
        description: "回测开始日期 YYYYMMDD"
        required: true
        default: "20230101"
      set:
        description: "方案组：base 或 100k"
        required: true
        default: "base"
      end:
        description: "回测结束日期 YYYYMMDD（留空=最近交易日）"
        required: false
        default: ""
permissions:
  contents: write
concurrency: daily-data
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Asia/Shanghai
      TS_TOKEN: ${{ secrets.TS_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: 回测
        run: |
          if [ -n "${{ inputs.end }}" ]; then E="--end ${{ inputs.end }}"; else E=""; fi
          if [ "${{ inputs.script }}" = "xval" ]; then
            python backtest/xval_backtest.py --start ${{ inputs.start }} $E
          elif [ "${{ inputs.script }}" = "kc50" ]; then
            python backtest/kc50_backtest.py --start ${{ inputs.start }} $E
          else
            python backtest/opt_backtest.py --start ${{ inputs.start }} --set ${{ inputs.set }} $E
          fi
      - name: 提交结果和缓存
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add reports/backtest data/bt || true
          git diff --cached --quiet || git commit -m "期权回测 ${{ inputs.start }}"
          git pull --rebase origin main && git push origin main
